<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>総覧 — 資格・免許管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/common.css">
<link rel="stylesheet" href="assets/css/visual-upgrade.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar" id="sidebar"></aside>
<div class="page-content">
<main class="page-main">

  <!-- ヘッダーエリア -->
  <div class="page-header page-header-v2">
    <img class="page-header-bg-img" src="assets/img/imperial/header-dashboard-bg.png" alt="" aria-hidden="true">
    <div class="page-heading">
      <div class="page-icon" aria-hidden="true"></div>
      <div class="page-title-block">
        <div class="page-title">総覧</div>
        <div class="page-title-en">IMPERIAL RECORD DASHBOARD</div>
      </div>
    </div>
  </div>

  <section class="stats" aria-label="主要指標">
    <div class="stat-card danger">
      <div class="kpi-corner tl"></div><div class="kpi-corner tr"></div><div class="kpi-corner bl"></div><div class="kpi-corner br"></div>
      <div class="stat-top"><span>期限切れ</span></div>
      <div class="stat-icon" aria-hidden="true"></div>
      <div class="stat-value" id="stat-expired">0</div>
      <div class="stat-sub">更新期限を超過</div>
    </div>
    <div class="stat-card warning">
      <div class="kpi-corner tl"></div><div class="kpi-corner tr"></div><div class="kpi-corner bl"></div><div class="kpi-corner br"></div>
      <div class="stat-top"><span>30日以内</span></div>
      <div class="stat-icon" aria-hidden="true"></div>
      <div class="stat-value" id="stat-critical">0</div>
      <div class="stat-sub">至急確認が必要</div>
    </div>
    <div class="stat-card info">
      <div class="kpi-corner tl"></div><div class="kpi-corner tr"></div><div class="kpi-corner bl"></div><div class="kpi-corner br"></div>
      <div class="stat-top"><span>90日以内</span></div>
      <div class="stat-icon" aria-hidden="true"></div>
      <div class="stat-value" id="stat-warning">0</div>
      <div class="stat-sub">更新予定の確認</div>
    </div>
    <div class="stat-card sakura">
      <div class="kpi-corner tl"></div><div class="kpi-corner tr"></div><div class="kpi-corner bl"></div><div class="kpi-corner br"></div>
      <div class="stat-top"><span>昇格候補</span></div>
      <div class="stat-icon" aria-hidden="true"></div>
      <div class="stat-value" id="stat-promo">0</div>
      <div class="stat-sub">評定対象者</div>
    </div>
    <div class="stat-card">
      <div class="kpi-corner tl"></div><div class="kpi-corner tr"></div><div class="kpi-corner bl"></div><div class="kpi-corner br"></div>
      <div class="stat-top"><span>社員数</span></div>
      <div class="stat-icon" aria-hidden="true"></div>
      <div class="stat-value" id="stat-employees">0</div>
      <div class="stat-sub">登録社員数</div>
    </div>
  </section>

  <section class="content-grid">
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">更新警鐘</div>
          <div class="card-sub">期限切れ・30日以内・90日以内の資格</div>
        </div>
        <a class="btn btn-secondary btn-sm" href="alerts.html">一覧へ →</a>
      </div>
      <div class="card-body" id="alert-list"><div class="empty">読込中</div></div>
    </div>

    <div class="card">
      <div class="card-header card-header-navy">
        <div>
          <div class="card-title">昇格評定</div>
          <div class="card-sub">昇格候補者の確認</div>
        </div>
        <a class="btn btn-secondary btn-sm" href="promotion.html">確認へ →</a>
      </div>
      <div class="card-body" id="promo-list"><div class="empty">読込中</div></div>
    </div>

    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">事業所別 保有率</div>
          <div class="card-sub">事業所別の資格保有状況を確認</div>
        </div>
        <a class="btn btn-secondary btn-sm" href="facility_licenses.html">確認へ →</a>
      </div>
      <div class="card-body" id="coverage-list"><div class="empty">読込中</div></div>
    </div>

    <div class="card">
      <div class="card-header card-header-navy">
        <div>
          <div class="card-title">期限到来予定</div>
          <div class="card-sub">期限到来予定の資格一覧</div>
        </div>
        <a class="btn btn-secondary btn-sm" href="licenses.html">確認へ →</a>
      </div>
      <div class="card-body" id="monthly-bars"><div class="empty">読込中</div></div>
    </div>
  </section>
</main>
</div>
</div>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/dashboard.js"></script>
<script>(async()=>{await Auth.requireAuth();renderSidebar('index');Modal.setup();APP.initHeader();await initDashboard();})();</script>
</body>
</html>
