<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>採用実績サマリー</title><link href="./assets/css/common.css?v=20260811_report_layout2" rel="stylesheet"/><link href="./assets/css/header.css?v=20260811_report_layout2" rel="stylesheet"/><link href="./assets/css/sidebar.css?v=20260811_report_layout2" rel="stylesheet"/><link href="./assets/css/dashboard_ui.css?v=20260811_report_layout2" rel="stylesheet"/><link href="./assets/css/recruit_reports.css?v=20260811_report_layout2" rel="stylesheet"/><script src="assets/js/version.js?v=20260811_report_layout2"></script><script src="./common.js?v=20260811_report_layout2"></script><script src="assets/js/dashboard_utils.js?v=20260811_report_layout2"></script><script src="assets/js/supabase.js?v=20260811_report_layout2"></script><script src="assets/js/auth.js?v=20260811_report_layout2"></script><script src="assets/js/ui_utils.js?v=20260811_report_layout2"></script><script src="./sidebar.js?v=20260811_report_layout2"></script></head><body class="auth-checking"><div class="container hidden" id="authScreen"><div class="auth-shell"><h1 class="auth-title">採用実績サマリー</h1><div class="auth-card"><label>メールアドレス</label><input id="loginEmail" type="email"><label>パスワード</label><input id="loginPassword" type="password"><button class="btn-primary" onclick="login()">ログイン</button><div id="authMessage" class="message-box message-info">未ログインです</div></div></div></div><div class="hidden" id="appScreen"><div class="app-layout"><aside class="sidebar" id="dashboardSidebarMenu"></aside><main class="main-content"><header class="page-header dashboard-page-header report-head"><div><h1>採用実績サマリー</h1><p>全体の採用状況と、本部・職種・媒体の内訳を一画面で確認します。</p></div><button class="btn-secondary no-print" onclick="printPage()">印刷</button></header><section class="analysis-control-card no-print">
<div class="analysis-control-copy"><p>集計条件</p><h2>全体から本部・職種・媒体の内訳まで確認</h2></div>
<div class="analysis-control-form analysis-control-form--4">
<div class="analysis-field"><label for="fy">対象年度</label><select id="fy" onchange="fyChanged()"></select></div>
<div class="analysis-field"><label for="month">応募月</label><select id="month" onchange="render()"></select></div>
<div class="analysis-field"><label for="division">本部</label><select id="division" onchange="render()"><option value="">全本部</option></select></div>
<div class="analysis-field"><label for="channel">媒体</label><select id="channel" onchange="render()"><option value="">全媒体</option></select></div>
</div>
</section><section class="report-print-title"><h2 id="reportTitle">採用実績サマリー</h2><div id="asOf"></div></section><section class="card"><div class="summary-grid report-summary-grid report-summary-grid--six" id="kpis"></div><p class="report-note">※「採用決定」は採用決定済み（入社済みを含む）、「入社待ち」は採用決定済みかつ未入社です。既存の「採用＝実入社」判定は変更していません。</p></section><div class="report-two"><section class="card table-card report-table-card"><div class="table-head"><h2>本部別</h2></div><div class="table-wrap"><table class="report-table report-table--summary"><thead><tr><th>本部</th><th>応募</th><th>面接</th><th>採用決定</th><th>入社待ち</th><th>入社</th></tr></thead><tbody id="divisionBody"></tbody></table></div></section><section class="card table-card report-table-card"><div class="table-head"><h2>職種別</h2></div><div class="table-wrap"><table class="report-table report-table--summary"><thead><tr><th>職種</th><th>応募</th><th>面接</th><th>採用決定</th><th>入社</th></tr></thead><tbody id="jobBody"></tbody></table></div></section></div><section class="card table-card report-table-card"><div class="table-head"><h2>本部 × 職種</h2></div><div class="table-wrap"><table class="report-table report-table--wide"><thead><tr><th>本部</th><th>職種</th><th>応募</th><th>面接</th><th>内定到達</th><th>採用決定</th><th>入社待ち</th><th>入社</th></tr></thead><tbody id="crossBody"></tbody></table></div></section><section class="card table-card report-table-card"><div class="table-head"><h2>媒体別</h2></div><div class="table-wrap"><table class="report-table report-table--summary"><thead><tr><th>媒体</th><th>応募</th><th>面接</th><th>採用決定</th><th>入社</th><th>応募→入社</th></tr></thead><tbody id="channelBody"></tbody></table></div></section><div id="pageMessage" class="message-box message-info hidden"></div></main></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.getRecruitSupabaseClient();let currentUser=null,currentRole=null,rows=[];const $=id=>document.getElementById(id);function setMsg(id,msg,type="info"){const e=$(id);if(!e)return;e.textContent=msg||"";e.className=`message-box message-${type}${msg?"":" hidden"}`}function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}function validDate(v){return !!v&&Number(String(v).slice(0,4))>=2000}function fyNow(){const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;return m>=4?y:y-1}function rangeFor(v){const fy=Number(v);return {from:`${fy}-04-01`,to:`${fy+1}-03-31`}}function months(fy){return Array.from({length:12},(_,i)=>{const m=((3+i)%12)+1,y=m>=4?fy:fy+1;return `${y}-${String(m).padStart(2,"0")}`})}function monthLabel(v){if(!v)return"全月";const [y,m]=v.split("-");return `${y}年${Number(m)}月`}function uniq(a){return [...new Set(a.map(v=>String(v||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"))}function opts(id,values,blank="すべて"){const e=$(id),keep=e.value;e.innerHTML=`<option value="">${blank}</option>`+uniq(values).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");if([...e.options].some(o=>o.value===keep))e.value=keep}function applied(r){return validDate(r.applied_date)}function interview(r){return window.isRecruitInterviewDone?window.isRecruitInterviewDone(r):(window.isRecruitStageReached&&window.isRecruitStageReached(r,"面接実施"))}function offer(r){return window.isRecruitStageReached?window.isRecruitStageReached(r,"内定"):validDate(r.offer_date)}function decision(r){return window.isRecruitHiringDecision?window.isRecruitHiringDecision(r):false}function hired(r){return window.isRecruitHired?window.isRecruitHired(r):validDate(r.join_date)}function pendingDecision(r){return decision(r)&&!hired(r)}function metrics(a){return{applied:a.filter(applied).length,interview:a.filter(interview).length,offer:a.filter(offer).length,decision:a.filter(decision).length,hired:a.filter(hired).length,pending:a.filter(pendingDecision).length}}function pct(n,d){return d?`${(n/d*100).toFixed(1)}%`:"0.0%"}function group(a,key){const m=new Map;for(const r of a){const k=String(r[key]||"未設定").trim()||"未設定";if(!m.has(k))m.set(k,[]);m.get(k).push(r)}return [...m].map(([name,rs])=>({name,rows:rs,m:metrics(rs)})).sort((a,b)=>b.m.applied-a.m.applied||a.name.localeCompare(b.name,"ja"))}function printPage(){window.print()}async function getUser(){currentUser=await window.RecruitPageAuth.getUser({client:sb,currentUser});return currentUser}async function getRole(userId){if(currentRole)return currentRole;const user=currentUser||(userId?{id:userId}:null);currentRole=await window.RecruitPageAuth.getRole({client:sb,user,currentRole});return currentRole}function showAuth(msg="未ログインです",type="info"){currentUser=null;currentRole=null;window.RecruitPageAuth.showAuth({msg,type,setMsg})}async function showApp(){const user=await getUser();if(!user){showAuth();return false}await getRole(user.id);window.RecruitPageAuth.showApp();return true}async function login(){await window.RecruitPageAuth.login({client:sb,setMsg,afterLogin:async()=>{currentUser=null;currentRole=null;if(await showApp())await loadAnalysis()}})}sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")showAuth("ログアウトしました","success")});async function authInit(){await window.RecruitPageAuth.authInit({client:sb,setMsg,onRole:(role,user)=>{currentRole=role;currentUser=user},afterAuth:loadAnalysis})}function bind(){const fy=fyNow();$("fy").innerHTML=[fy,fy-1,fy-2].map(y=>`<option value="${y}">${y}年度</option>`).join("");fyChanged();opts("division",rows.map(r=>r.division),"全本部");opts("channel",rows.map(r=>r.channel),"全媒体")}function fyChanged(){const fy=Number($("fy").value||fyNow());$("month").innerHTML='<option value="">全月</option>'+months(fy).map(v=>`<option value="${v}">${monthLabel(v)}</option>`).join("");render()}function filtered(){const rg=rangeFor($("fy").value||fyNow()),mo=$("month").value,d=$("division").value,ch=$("channel").value;return rows.filter(r=>!r.is_deleted&&applied(r)&&r.applied_date>=rg.from&&r.applied_date<=rg.to&&(!mo||String(r.applied_date).slice(0,7)===mo)&&(!d||String(r.division||"")===d)&&(!ch||String(r.channel||"")===ch))}function rowHtml(x,kind){return kind==='division'?`<tr><td>${esc(x.name)}</td><td>${x.m.applied}</td><td>${x.m.interview}</td><td>${x.m.decision}</td><td>${x.m.pending}</td><td>${x.m.hired}</td></tr>`:kind==='channel'?`<tr><td>${esc(x.name)}</td><td>${x.m.applied}</td><td>${x.m.interview}</td><td>${x.m.decision}</td><td>${x.m.hired}</td><td>${pct(x.m.hired,x.m.applied)}</td></tr>`:`<tr><td>${esc(x.name)}</td><td>${x.m.applied}</td><td>${x.m.interview}</td><td>${x.m.decision}</td><td>${x.m.hired}</td></tr>`}function render(){if(!rows.length)return;const a=filtered(),m=metrics(a);$("reportTitle").textContent=`採用実績サマリー　${monthLabel($("month").value)}`;$("asOf").textContent=`${new Date().toLocaleDateString("ja-JP")} 現在`;$("kpis").innerHTML=[["応募",m.applied],["面接",m.interview],["内定到達",m.offer],["採用決定",m.decision],["入社待ち",m.pending],["入社",m.hired]].map(x=>`<div class="metric-card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join("");for(const [id,key,kind,col] of [["divisionBody","division","division",6],["jobBody","job_type","job",5],["channelBody","channel","channel",6]]){const g=group(a,key);$(id).innerHTML=g.length?g.map(x=>rowHtml(x,kind)).join(""):`<tr><td colspan="${col}" class="empty">該当データなし</td></tr>`}let cr=[];for(const d of group(a,"division"))for(const j of group(d.rows,"job_type"))cr.push(`<tr><td>${esc(d.name)}</td><td>${esc(j.name)}</td><td>${j.m.applied}</td><td>${j.m.interview}</td><td>${j.m.offer}</td><td>${j.m.decision}</td><td>${j.m.pending}</td><td>${j.m.hired}</td></tr>`);$("crossBody").innerHTML=cr.join("")||'<tr><td colspan="8" class="empty">該当データなし</td></tr>'}async function loadAnalysis(){try{const{data,error}=await sb.from("candidates").select("id,applied_date,division,center_name,channel,job_type,status,hiring_result,appointment_date,interview1_date,interview_done_date,offer_date,join_date,is_deleted").order("id",{ascending:false});if(error)throw error;rows=data||[];bind();render()}catch(e){setMsg("pageMessage","読込失敗: "+(e.message||e),"error")}}authInit();</script></body></html>
