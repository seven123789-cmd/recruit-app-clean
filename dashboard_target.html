<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>本部・目標</title>
<link href="./assets/css/common.css" rel="stylesheet"/>
<link href="./assets/css/header.css" rel="stylesheet"/>
<link href="./assets/css/sidebar.css?v=20260508_sidebar2" rel="stylesheet"/>
<link href="./assets/css/dashboard_target.css" rel="stylesheet"/>
<script src="./common.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/ui_utils.js"></script>
<script src="assets/js/audit_utils.js"></script>
<script src="assets/js/ops_guard.js"></script>
<script src="assets/js/safe_utils.js"></script>
<script src="./sidebar.js?v=20260513_compare_graph"></script>
<link href="./assets/css/dashboard_ui.css" rel="stylesheet"/>
</head>
<body class="auth-checking">
<div class="container hidden" id="authScreen">
<div class="auth-shell">
<h1 class="auth-title">本部・目標</h1>
<p class="auth-sub">ログイン後に画面を表示します。</p>
<div class="auth-card">
<h2>ログイン</h2>
<div class="form-grid">
<div class="col-12">
<label for="loginEmail">メールアドレス</label>
<input id="loginEmail" placeholder="example@sline.co.jp" type="email"/>
</div>
<div class="col-12">
<label for="loginPassword">パスワード</label>
<input id="loginPassword" placeholder="パスワード" type="password"/>
</div>
<div class="col-12">
<button class="btn-primary" onclick="login()" type="button">ログイン</button>
</div>
<div class="col-12">
<div class="message-box message-info" id="authMessage">未ログインです</div>
</div>
</div>
</div>
</div>
</div>
<div class="hidden" id="appScreen">
<div class="app-layout">
<aside class="sidebar" id="dashboardSidebarMenu" aria-label="採用管理メニュー"></aside>
<main class="main-content">
<header class="page-header dashboard-page-header"><div class="dashboard-title-line"><h1>本部・目標</h1><div aria-label="集計状態" class="dashboard-header-meta"><span class="dashboard-header-chip">対象年度：<span id="sideCondition">-</span></span><span class="dashboard-header-chip">対象件数：<span id="sideRows">0</span></span><span class="dashboard-header-chip">目標合計：<span id="sideTarget">0</span></span><span class="dashboard-header-chip">不足人数：<span id="sideShortage">0</span></span><span class="dashboard-header-chip">達成率：<span id="sideRate">0.0%</span></span></div></div></header>
<section class="year-control-card analysis-control-card">
<div class="year-control-copy analysis-control-copy">
<p class="eyebrow">分析条件</p>
<h2>本部別の目標達成を比較</h2>
</div>
<div class="year-control-actions analysis-control-form analysis-control-form--1">
<div class="analysis-field">
<label for="fy">対象年度</label>
<select id="fy" onchange="applyFy();loadAnalysis();">
<option value="current"></option>
<option value="previous"></option>
<option value="all">全期間</option>
</select>
</div>
<button class="btn-primary" onclick="loadAnalysis()" type="button">更新</button>
<div class="year-range analysis-period" id="yearRangeText">対象期間：-</div>
</div>
<input id="from" type="hidden"/>
<input id="to" type="hidden"/>
</section>
<section class="card">
<h2>サマリー</h2>
<div class="grid-5 summary-grid">
<div class="metric-card kpi-applied">
<div class="label">応募</div>
<div class="value" id="sumApplied">0</div>
<div class="sub">対象年度内の応募数</div>
</div>
<div class="metric-card kpi-interview">
<div class="label">面接実施</div>
<div class="value" id="sumInterview">0</div>
<div class="sub">面接まで進んだ人数</div>
</div>
<div class="metric-card kpi-hired">
<div class="label">採用</div>
<div class="value" id="sumJoin">0</div>
<div class="sub">入社日登録済み</div>
</div>
<div class="metric-card kpi-rate-interview">
<div class="label">応募→面接</div>
<div class="value" id="sumInterviewRate">0.0%</div>
<div class="sub">応募数に対する面接率</div>
</div>
<div class="metric-card kpi-rate-hired">
<div class="label">応募→採用</div>
<div class="value" id="sumRate">0.0%</div>
<div class="sub">応募数に対する採用率</div>
</div>
</div>
</section>
<section class="card">
<div class="section-head">
<div>
<h2>本部別 達成状況</h2>
</div>
</div>
<div class="target-chart" id="targetChart">
<div class="empty-chart">読込中です</div>
</div>
</section>
<section class="card table-card">
<div class="table-head">
<h2>本部別 目標 vs 実績</h2>
</div>
<div class="table-wrap">
<table>
<thead id="tableHead"></thead>
<tbody id="tableBody"><tr><td class="empty">読込中です</td></tr></tbody>
</table>
</div>
</section>

<div class="log-box" id="logBox">待機中</div>
</main>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./dashboard_target.js"></script>
<script src="dashboard_summary_links.js"></script>
</body>
</html>
