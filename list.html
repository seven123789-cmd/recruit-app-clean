<body class="auth-checking">

<div id="authScreen" class="container hidden">
  <div class="auth-shell">
    <h1 class="auth-title">応募者一覧</h1>
    <p class="auth-sub">ログイン後に画面を表示します。</p>
    <div class="auth-card">

      <div class="form-grid">
        <div class="col-12">
          <label for="loginEmail">メールアドレス</label>
          <input id="loginEmail" type="email" placeholder="example@sline.co.jp">

</div>

<div id="appScreen" class="hidden">
  <div class="app-layout">
        <aside class="sidebar" id="dashboardSidebarMenu" aria-label="採用管理メニュー"></aside>

      <header class="page-header">
        <h1>応募者一覧</h1>

      <section class="card">

        <div class="form-grid">
          <div class="col-2">
            <label for="filterYear">応募年度</label>

          <div class="col-2">
            <label for="filterMonth">応募月</label>
            <select id="filterMonth">
              <option value="">全月</option>
              <option value="01">1月</option>
              <option value="02">2月</option>
              <option value="03">3月</option>
              <option value="04">4月</option>
              <option value="05">5月</option>
              <option value="06">6月</option>
              <option value="07">7月</option>
              <option value="08">8月</option>
              <option value="09">9月</option>
              <option value="10">10月</option>
              <option value="11">11月</option>
              <option value="12">12月</option>
            </select>
          </div>
          <div class="col-2">
            <label for="filterDivision">本部</label>
            <select id="filterDivision"><option value="">全部</option></select>
          </div>
          <div class="col-2">
            <label for="filterCenter">営業所</label>
            <select id="filterCenter"><option value="">全営業所</option></select>

          <div class="col-2">
            <label for="filterOwner">担当者</label>

          <div class="col-2">
            <label for="filterChannel">媒体</label>

            <label for="filterDateType">日付種類</label>
            <select id="filterDateType">
              <option value="applied_date">応募日</option>
              <option value="appointment_date">アポ日</option>
              <option value="interview1_date">面接設定日</option>
              <option value="interview_done_date">面接実施日</option>
              <option value="offer_date">内定日</option>
              <option value="join_date">採用日</option>
              <option value="next_action_date">次回対応日</option>
            </select>
          </div>
          <div class="col-3">
            <label for="filterDateFrom">開始日</label>
            <input id="filterDateFrom" type="date">
          </div>
          <div class="col-3">
            <label for="filterDateTo">終了日</label>

          <div class="col-12 list-status-filter-panel">

            </div>
            <div id="statusFilterChips" class="status-filter-chips" aria-label="ステータス絞り込み"></div>
          </div>

            <div class="list-status-filter-head">

                <span class="list-filter-note">進行中・保留・辞退・不採用・不通・採用・入社済を複数選択可</span>
              </div>
              <button class="btn-secondary list-status-clear" type="button" onclick="clearResultFilters()">選考結果解除</button>

            <button class="btn-secondary" type="button" onclick="setSortMode('appliedAsc')" id="sortAppliedAscBtn">応募日 ↑</button>

        <div class="bulk-action-bar">

<script>
const sb=window.getRecruitSupabaseClient();

let currentUser=null;
let currentRole=null;
let CENTER_MASTER={};
let allCandidateRows=[];
let currentListFilter="all";
let sortMode="actionAsc";
let dashboardFrom="";
let dashboardTo="";
let dashboardFilterActive=false;
let dashboardContextActive=false;
let listMasterChannels=[];
let listMasterStatuses=[];
let statusColorMap={};
let selectedStatusFilters=new Set();
let selectedResultFilters=new Set();
let dashboardJob="";
const selectedIds = new Set();
let currentVisibleRows=[];
let renderCandidatesTimer=null;
const LIST_VIRTUAL_ROW_HEIGHT = 72;
const LIST_VIRTUAL_BUFFER = 6;
let listShouldResetScroll = false;
const listVirtualState = { rows:[], start:-1, end:-1, today:"" };

const ACTIVE_STATUSES=window.RECRUIT_STAGE_STATUSES || ["応募","書類選考","アポ取得","面接設定","面接実施","内定","採用"];
const HIRING_RESULT_OPTIONS=window.RECRUIT_HIRING_RESULTS || ["進行中","保留","辞退","不採用","不通","採用","入社済"];
const STATE="recruit_list_filter_state";
const NAV="recruit_list_navigation_state";

function $(id){return document.getElementById(id)}

function setMsg(id,msg,type="info"){
  const el=$(id);
  if(!el)return;
  el.textContent=msg;
  el.className="message-box message-"+type;
}
function todayStr(){
  if(window.RecruitDate?.todayJST) return window.RecruitDate.todayJST();
  const parts=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).reduce((a,p)=>{if(p.type!=="literal")a[p.type]=p.value;return a;},{});
  return `${parts.year}-${parts.month}-${parts.day}`;
}

function validDate(s){
  if(!s)return false;
  const y=Number(String(s).slice(0,4));
  return y>=2000;
}

function normalizeListCandidate(row){
  const source = row || {};
  if(window.normalizeRecruitCandidateState) return window.normalizeRecruitCandidateState(source);
  const out = { ...source };
  const status = String(out.status || "").trim();
  if(validDate(out.join_date) || status === "入社"){
    out.status = "採用";
    out.hiring_result = "入社済";
  }else if(["保留","辞退","不採用","不通"].includes(status)){
    if(!out.hiring_result || out.hiring_result === "進行中") out.hiring_result = status;
    if(out.interview_done_date) out.status = "面接実施";
    else if(out.interview1_date) out.status = "面接設定";
    else if(out.appointment_date) out.status = "アポ取得";
    else out.status = "応募";
  }
  return out;
}

function isActionRequired(r){
  if(window.isRecruitActionRequired) return window.isRecruitActionRequired(r);
  r = normalizeListCandidate(r);
  const st=String(r.status||"").trim();
  const result=normalizeHiringResult(r);
  if(st === "採用")return false;
  if(result !== "進行中")return false;
  if(!ACTIVE_STATUSES.includes(st))return false;
  if(!r.next_action_date)return true;
  return String(r.next_action_date).slice(0,10)<=todayStr();
}
function isHired(r){
  return window.isRecruitHired ? window.isRecruitHired(r) : (!!r && (String(r.hiring_result||"").trim()==="入社済" || validDate(r.join_date)));
}
function normalizeStatusColor(value){
  const v=String(value||"").trim();
  return /^#[0-9a-fA-F]{6}$/.test(v) ? v : "#64748b";
}
function hexToRgba(hex,alpha){
  const h=normalizeStatusColor(hex).replace("#","");
  const r=parseInt(h.slice(0,2),16);
  const g=parseInt(h.slice(2,4),16);
  const b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function badge(v){
  const t=v||"未設定";
  const color=normalizeStatusColor(statusColorMap[t]||"");
  const cls=v?"badge":"badge badge-empty";
  const style=v?` style="color:${esc(color)};border-color:${esc(hexToRgba(color,.34))};background:${esc(hexToRgba(color,.10))}"`:"";
  return `<span class="${cls}"${style}>${esc(t)}</span>`;
}
function normalizeHiringResult(row){
  const normalized = normalizeListCandidate(row);
  const result=String(normalized?.hiring_result||"").trim();
  if(result === "合格") return "採用";
  if(result) return result;
  const legacyStatus=String(row?.status||"").trim();
  return ["保留","辞退","不採用","不通","採用","入社済","入社"].includes(legacyStatus) ? (legacyStatus === "入社" ? "入社済" : legacyStatus) : "進行中";
}
function resultBadge(row){
  const result=normalizeHiringResult(row);
  const cls=result==="入社済"?"result-joined":result==="採用"?"result-hired":result==="不採用"?"result-rejected":result==="辞退"?"result-declined":result==="不通"?"result-no-contact":result==="保留"?"result-hold":"result-pending";
  return `<span class="result-badge ${cls}">${esc(result)}</span>`;
}
function statusResultCell(row){
  const normalized = normalizeListCandidate(row);
  return `<div class="status-result-cell"><div class="status-line">${badge(normalized.status)}</div><div class="result-line"><span>選考結果</span>${resultBadge(normalized)}</div></div>`;
}

function getFiscalYearFromAppliedDate(dateStr){
  if(!dateStr)return "";
  const dt=new Date(dateStr+"T00:00:00+09:00");
  if(Number.isNaN(dt.getTime()))return "";
  return dt.getMonth()+1>=4 ? String(dt.getFullYear()) : String(dt.getFullYear()-1);
}
function getDashboardFiscalYear(){
  if(dashboardFrom)return getFiscalYearFromAppliedDate(dashboardFrom);
  if(dashboardTo)return getFiscalYearFromAppliedDate(dashboardTo);
  return "";
}
function fiscalYearLabel(value){
  const v=String(value||"").trim();
  return /^\d{4}$/.test(v) ? v + "年度" : v;
}
function setFilterValue(id,value){
  const el=$(id);
  if(!el)return;
  const v=String(value||"");
  if(v && ![...el.options].some(opt=>opt.value===v)){
    const option=document.createElement("option");
    option.value=v;
    option.textContent=id==="filterYear" ? fiscalYearLabel(v) : v;
    el.appendChild(option);
  }
  if(id==="filterYear"){
    [...el.options].forEach(opt=>{
      if(/^\d{4}$/.test(String(opt.value||""))) opt.textContent=fiscalYearLabel(opt.value);
    });
  }
  el.value=v;
}
function clearDashboardRangeFilter(){
  dashboardFrom="";
  dashboardTo="";
  dashboardFilterActive=false;
  dashboardJob="";
  sessionStorage.removeItem("recruit_dashboard_list_filter");
  localStorage.removeItem("recruit_dashboard_list_filter");
}
function setDashboardYearDisplay(){
  if(!dashboardFilterActive)return;
  const fy=getDashboardFiscalYear();
  if(fy)setFilterValue("filterYear",fy);
  setFilterValue("filterMonth","");
}
function readDashboardFilterPayload(){
  const params=new URLSearchParams(location.search);

  const source=params.get("source") || (params.get("from")==="dashboard" ? "dashboard" : "");
  const hasUrlDashboard=source==="dashboard" || params.has("fromDate") || params.has("toDate") || params.has("dashboardFrom") || params.has("dashboardTo") || params.has("dateFrom") || params.has("dateTo");

  let saved=null;
  try{
    saved=JSON.parse(sessionStorage.getItem("recruit_dashboard_list_filter") || localStorage.getItem("recruit_dashboard_list_filter") || "null");
  }catch(e){
    saved=null;
  }

  const hasSavedDashboard=saved && (saved.source==="dashboard" || saved.from || saved.to || saved.filterType || saved.division || saved.center || saved.owner || saved.channel);

  // dashboardからの遷移条件は毎回1回だけ使う。
  // sessionStorage/localStorageに残したままだと、前回の2026年度などが次回の全期間クリックに混ざる。
  sessionStorage.removeItem("recruit_dashboard_list_filter");
  localStorage.removeItem("recruit_dashboard_list_filter");

  if(!hasUrlDashboard && !hasSavedDashboard)return null;

  const rawFrom=params.get("from");
  const urlFrom=(rawFrom && rawFrom!=="dashboard") ? rawFrom : "";

  return {
    source:"dashboard",
    filter:params.get("filter") || saved?.filterType || "",
    from:urlFrom || params.get("fromDate") || params.get("dashboardFrom") || params.get("dateFrom") || saved?.from || saved?.dashboardFrom || saved?.dateFrom || "",
    to:params.get("to") || params.get("toDate") || params.get("dashboardTo") || params.get("dateTo") || saved?.to || saved?.dashboardTo || saved?.dateTo || "",
    year:params.get("year") || params.get("fiscalYear") || saved?.year || saved?.fiscalYear || "",
    division:params.get("division") || saved?.division || "",
    center:params.get("center") || saved?.center || "",
    owner:params.get("owner") || saved?.owner || "",
    channel:params.get("channel") || saved?.channel || "",
    job:params.get("job") || saved?.job || ""
  };
}
function setSelectOptions(id,values,blank){
  const el=$(id);
  if(!el)return;
  const cur=el.value;
  const list=[...new Set((values||[]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"ja"));
  el.innerHTML='<option value="">'+blank+'</option>';
  list.forEach(v=>{
    const label=id==="filterYear" ? fiscalYearLabel(v) : v;
    el.innerHTML+='<option value="'+esc(v)+'">'+esc(label)+'</option>';
  });
  if(list.includes(cur))el.value=cur;
}
async function getUser(){
  if(currentUser)return currentUser;
  const {data:{session}}=await sb.auth.getSession();
  currentUser=session?.user||null;
  return currentUser;
}
async function getRole(userId){
  if(currentRole)return currentRole;
  try{
    const {data}=await sb.from("profiles").select("role").eq("user_id",userId).single();
    currentRole=data?.role||"viewer";
    if(window.RecruitOpsGuard) window.RecruitOpsGuard.setRole(currentRole);
  }catch(e){
    currentRole="viewer";
    if(window.RecruitOpsGuard) window.RecruitOpsGuard.setRole(currentRole);
  }
  return currentRole;
}
function showAuth(msg="未ログインです",type="info"){
  $("authScreen")?.classList.remove("hidden");
  $("appScreen")?.classList.add("hidden");
  currentUser=null;
  currentRole=null;
  setMsg("authMessage",msg,type);
  document.body.classList.remove("auth-checking");
}
async function showApp(){
  const user=await getUser();
  if(!user){
    showAuth();
    return false;
  }
  await getRole(user.id);
  $("authScreen")?.classList.add("hidden");
  $("appScreen")?.classList.remove("hidden");
  document.body.classList.remove("auth-checking");
  return true;
}
async function login(){
  const email=$("loginEmail")?.value.trim();
  const password=$("loginPassword")?.value;
  if(!email||!password){
    setMsg("authMessage","メールアドレスとパスワードを入力してください","error");
    return;
  }
  try{
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;
    currentUser=null;
    currentRole=null;
    if(await showApp()) await initPageAfterLogin();
  }catch(e){
    setMsg("authMessage","ログイン失敗: "+(e.message||e),"error");
  }
}
async function logout(){
  try{await sb.auth.signOut()}catch(e){}
  showAuth("ログアウトしました","success");
}
sb.auth.onAuthStateChange((ev)=>{
  if(ev==="SIGNED_OUT")showAuth("ログアウトしました","success");
});
async function authInit(){
  try{
    if(await showApp()) await initPageAfterLogin();
  }catch(e){
    console.error(e);
    showAuth("初期化に失敗しました","error");
  }finally{
    document.body.classList.remove("auth-checking");
  }
}

function saveState(){
  // dashboardから来た一時条件はLISTの通常保存条件に混ぜない。
  // ここで保存すると、次回「全期間」で開いた時に前回年度が復活する。
  if(dashboardContextActive)return;

  localStorage.setItem(STATE,JSON.stringify({
    listFilter:currentListFilter,
    sortMode,
    year:$("filterYear").value,
    month:$("filterMonth").value,
    division:$("filterDivision").value,
    center:$("filterCenter").value,
    owner:$("filterOwner").value,
    channel:$("filterChannel").value,
    dateType:$("filterDateType")?.value||"applied_date",
    dateFrom:$("filterDateFrom")?.value||"",
    dateTo:$("filterDateTo")?.value||"",
    statuses:[...selectedStatusFilters],
    results:[...selectedResultFilters]
  }));
}
function restoreState(){
  try{return JSON.parse(localStorage.getItem(STATE)||"null")}catch(e){return null}
}
function applyDashboardFilterIfExists(){
  const payload=readDashboardFilterPayload();
  if(!payload)return false;

  dashboardContextActive=true;
  dashboardFrom=validDate(payload.from) ? payload.from : "";
  dashboardTo=validDate(payload.to) ? payload.to : "";
  dashboardFilterActive=!!(dashboardFrom||dashboardTo);
  dashboardJob=payload.job||"";

  // dashboard遷移時は、LISTに残っていた前回年度・月を必ず消す。
  setFilterValue("filterYear","");
  setFilterValue("filterMonth","");

  if(payload.filter){
    currentListFilter=payload.filter || "all";
  }

  setFilterValue("filterDivision",payload.division||"");
  setFilterValue("filterCenter",payload.center||"");
  setFilterValue("filterOwner",payload.owner||"");
  setFilterValue("filterChannel",payload.channel||"");

  if(dashboardFilterActive){
    setDashboardYearDisplay();
  }else if(payload.year){
    setFilterValue("filterYear",payload.year);
  }

  return true;
}

async function loadMasterDivisionCenterOptions(){

async function loadListMasterStatuses(rows=[]){
  listMasterStatuses=[];
  statusColorMap={};
  try{
    let result=await sb
      .from("master_statuses")
      .select("name,color,display_order,is_active")
      .order("display_order",{ascending:true});

    if(result.error){
      result=await sb
        .from("master_statuses")
        .select("name,color,is_active")
        .order("name",{ascending:true});
    }
    if(result.error)throw result.error;

    listMasterStatuses=(result.data||[])
      .filter(row=>row && row.is_active!==false)
      .map(row=>({
        name:String(row.name||"").trim(),
        color:normalizeStatusColor(row.color||""),
        display_order:Number(row.display_order||0)
      }))
      .filter(row=>row.name)
      .filter(row=>!(window.isDeprecatedRecruitStatus && window.isDeprecatedRecruitStatus(row.name)));
  }catch(e){
    console.warn("ステータスマスタ読込失敗", e);
    const names=window.RecruitMaster ? await window.RecruitMaster.list("statuses").catch(()=>[]) : [];
    listMasterStatuses=(names||[]).map((name,index)=>({
      name:String(name||"").trim(),
      color:window.recruitStatusDefaultColor ? window.recruitStatusDefaultColor(String(name||"").trim()) : "#64748b",
      display_order:index+1
    })).filter(row=>row.name);
  }

  if(!listMasterStatuses.length){
    listMasterStatuses=[...new Set((rows||[]).map(r=>String(r.status||"").trim()).filter(Boolean))]
      .sort((a,b)=>String(a).localeCompare(String(b),"ja"))
      .map((name,index)=>({
        name,
        color:window.recruitStatusDefaultColor ? window.recruitStatusDefaultColor(name) : "#64748b",
        display_order:index+1
      }));
  }

  const currentRowsByName=new Map(listMasterStatuses.map(row=>[row.name,row]));
  const mergedNames=window.mergeRecruitStatusNames ? window.mergeRecruitStatusNames(listMasterStatuses.map(row=>row.name)) : listMasterStatuses.map(row=>row.name);
  listMasterStatuses=mergedNames.map((name,index)=>{
    const current=currentRowsByName.get(name);
    return {
      name,
      color:normalizeStatusColor(current?.color || (window.recruitStatusDefaultColor ? window.recruitStatusDefaultColor(name) : "#64748b")),
      display_order:Number(current?.display_order || (index+1)*10)
    };
  });

  statusColorMap=Object.fromEntries(listMasterStatuses.map(row=>[row.name,normalizeStatusColor(row.color)]));
}

function sortPriority(row){
  const today=todayStr();

  if(isActionRequired(row)){
    if(row.next_action_date && row.next_action_date < today)return 0;   // 期限切れ：赤塗り最優先
    if(row.next_action_date === today)return 1;                         // 今日
    if(row.next_action_date)return 2;                                   // 対応日あり
    return 3;                                                           // 未設定
  }

  return 9;
}
function dateTime(value, emptyValue){
  if(!value)return emptyValue;
  const t=new Date(value+"T00:00:00+09:00").getTime();
  return Number.isNaN(t) ? emptyValue : t;
}
function isInterviewNotDone(r){
  return validDate(r.interview1_date) && !validDate(r.interview_done_date) && !isFinal(r);
}
function normalizedCandidateForList(r){
  return window.normalizeRecruitCandidateState ? window.normalizeRecruitCandidateState(r || {}) : (r || {});
}
function hasInterviewReachedForList(r){
  const row=normalizedCandidateForList(r);
  const st=String(row.status||"").trim();
  const result=String(row.hiring_result||"").trim();
  return validDate(row.interview_done_date)
    || validDate(row.offer_date)
    || validDate(row.join_date)
    || ["面接実施","内定","採用"].includes(st)
    || ["採用","入社済"].includes(result);
}
function isHiringDecisionForList(r){
  if(window.isRecruitHiringDecision) return window.isRecruitHiringDecision(r);
  const row=normalizedCandidateForList(r);
  return String(row.status||"").trim()==="採用" || ["採用","入社済"].includes(String(row.hiring_result||"").trim()) || validDate(row.join_date);
}
function isStageForList(r, stageName){

}
function isStageReachedForList(r, stageName){
  return window.isRecruitStageReached ? window.isRecruitStageReached(r, stageName) : isStageForList(r, stageName);
}
function isDormant3Days(r){
  if(window.isRecruitDormant3Days) return window.isRecruitDormant3Days(r);
  if(!validDate(r.applied_date) || isFinal(r))return false;
  if(validDate(r.appointment_date) || validDate(r.interview1_date) || validDate(r.interview_date) || validDate(r.interview_done_date))return false;
  const days=daysBetween(r.applied_date,todayStr());
  return days!==null && days>=3;
}

}
function isNoContact(r){

}
function isDecline(r){

    ? window.isRecruitDeclined(r)

function isInterviewNotSet(r){
  return validDate(r.appointment_date) && !validDate(r.interview1_date) && !isFinal(r);
}
function isHeatInterviewGap(r){
  return validDate(r.applied_date) && !validDate(r.interview_done_date) && !isFinal(r);
}
function isHeatHireGap(r){
  return validDate(r.applied_date) && !isHired(r) && !isFinal(r);
}
function applyListFilterRows(rows){
  switch(currentListFilter){
    case "all":
      return rows;
    case "applied":
      return rows.filter(r=>validDate(r.applied_date));
    case "stage_appointment":
      return rows.filter(r=>isStageForList(r,"アポ取得"));
    case "stage_interview_set":
      return rows.filter(r=>isStageForList(r,"面接設定"));
    case "stage_interview_done":
      return rows.filter(r=>isStageForList(r,"面接実施"));
    case "stage_offer":
      return rows.filter(r=>isStageForList(r,"内定"));
    case "stage_hired":
      return rows.filter(r=>isStageForList(r,"採用"));
    case "appointment":
      return rows.filter(r=>isStageReachedForList(r,"アポ取得"));
    case "interview_set":
      return rows.filter(r=>isStageReachedForList(r,"面接設定"));
    case "interview_done":
      return rows.filter(r=>isStageReachedForList(r,"面接実施"));
    case "offer":
      return rows.filter(r=>isStageReachedForList(r,"内定"));
    case "hired":
      return rows.filter(r=>isStageReachedForList(r,"採用"));
    case "action":
    case "today":
    case "heat_action":
      return rows.filter(isActionRequired);
    case "owner_stagnation":
      return rows.filter(r => window.isRecruitOwnerStagnation ? window.isRecruitOwnerStagnation(r) : (isActionRequired(r) && r.next_action_date && r.next_action_date < todayStr()));
    case "not_done":
      return rows.filter(isInterviewNotDone);
    case "dormant":
      return rows.filter(isDormant3Days);
    case "no_contact":
      return rows.filter(isNoContact);
    case "decline":
      return rows.filter(isDecline);
    case "interview_not_set":
      return rows.filter(isInterviewNotSet);
    case "heat_danger":
      return rows.filter(isHeatmapDangerCandidate);
    case "heat_interview_gap":
      return rows.filter(isHeatInterviewGap);
    case "heat_hire_gap":
      return rows.filter(isHeatHireGap);
    default:
      return rows;
  }
}

function filteredRows(){
  if(dashboardFilterActive)setDashboardYearDisplay();

  const y=$("filterYear").value;
  const m=$("filterMonth").value;
  const d=$("filterDivision").value;
  const c=$("filterCenter").value;
  const o=$("filterOwner").value;
  const ch=$("filterChannel").value;
  const dateType=$("filterDateType")?.value || "applied_date";
  const dateFrom=$("filterDateFrom")?.value || "";
  const dateTo=$("filterDateTo")?.value || "";
  const job=dashboardJob;

  let arr=allCandidateRows.filter(r=>{
    if(dashboardFilterActive){
      if(!r.applied_date)return false;
      if(dashboardFrom&&r.applied_date<dashboardFrom)return false;
      if(dashboardTo&&r.applied_date>dashboardTo)return false;
    }else if(y||m){
      if(!r.applied_date)return false;
      const dt=new Date(r.applied_date+"T00:00:00+09:00");
      const fy=dt.getMonth()+1>=4?dt.getFullYear():dt.getFullYear()-1;
      if(y&&String(fy)!==y)return false;
      if(m&&String(dt.getMonth()+1).padStart(2,"0")!==m)return false;
    }
    if(dateFrom||dateTo){
      const targetDate=String(r[dateType]||"").slice(0,10);
      if(!validDate(targetDate))return false;
      if(dateFrom&&targetDate<dateFrom)return false;
      if(dateTo&&targetDate>dateTo)return false;
    }
    if(selectedStatusFilters.size && !selectedStatusFilters.has(String(normalizeListCandidate(r).status||"").trim()))return false;
    if(selectedResultFilters.size && !selectedResultFilters.has(normalizeHiringResult(r)))return false;
    return (!d||r.division===d)&&(!c||r.center_name===c)&&(!o||r.owner_name===o)&&(!ch||r.channel===ch)&&(!job||r.job_type===job);
  });

  arr=applyListFilterRows(arr);

  arr.sort((a,b)=>{
    const pa=sortPriority(a);
    const pb=sortPriority(b);
    if(pa!==pb)return pa-pb;

    if(sortMode==="actionDesc"){
      const da=dateTime(a.next_action_date,-1);
      const db=dateTime(b.next_action_date,-1);
      if(da!==db)return db-da;
    }else if(sortMode==="appliedDesc"){
      const da=dateTime(a.applied_date,-1);
      const db=dateTime(b.applied_date,-1);
      if(da!==db)return db-da;
    }else if(sortMode==="appliedAsc"){
      const da=dateTime(a.applied_date,9999999999999);
      const db=dateTime(b.applied_date,9999999999999);
      if(da!==db)return da-db;
    }else{
      const da=dateTime(a.next_action_date,9999999999999);
      const db=dateTime(b.next_action_date,9999999999999);
      if(da!==db)return da-db;
    }

    return dateTime(b.applied_date,-1)-dateTime(a.applied_date,-1);
  });

  return arr;
}

function isAdminRole(){
  return window.RecruitOpsGuard ? window.RecruitOpsGuard.canDelete(currentRole) : String(currentRole||"").toLowerCase() === "admin";
}

function getSelectedRows(){
  return allCandidateRows.filter(r => selectedIds.has(String(r.id)));
}

function updateBulkSelectCount(){
  const count = selectedIds.size;
  const el = $("bulkSelectCount");
  if(el) el.textContent = "選択 " + count + "件";

  const all = $("bulkSelectAll");
  if(all){
    const visibleRows = currentVisibleRows.length ? currentVisibleRows : filteredRows();
    const visibleIds = visibleRows.map(r => String(r.id));
    const selectedVisible = visibleIds.filter(id => selectedIds.has(id)).length;
    all.checked = visibleIds.length > 0 && selectedVisible === visibleIds.length;
    all.indeterminate = selectedVisible > 0 && selectedVisible < visibleIds.length;
  }

  const bulkDeleteButton = $("bulkDeleteButton");
  if(bulkDeleteButton){
    bulkDeleteButton.style.display = isAdminRole() ? "" : "none";
  }
}

function toggleBulkSelection(id, checked){
  const key = String(id);
  if(checked) selectedIds.add(key);
  else selectedIds.delete(key);
  updateBulkSelectCount();
}

function toggleBulkSelectAll(checked){
  const rows = currentVisibleRows.length ? currentVisibleRows : filteredRows();
  rows.forEach(r => {
    const key = String(r.id);
    if(checked) selectedIds.add(key);
    else selectedIds.delete(key);
  });
  renderCandidates();
}

function clearBulkSelection(){
  selectedIds.clear();
  renderCandidates();
}

function setupBulkOptions(){
  setupBulkStatusOptions();
  const ownerSelect = $("bulkOwner");
  if(ownerSelect){
    const current = ownerSelect.value;
    const owners = [...new Set((allCandidateRows||[])
      .map(r => String(r.owner_name||"").trim())
      .filter(Boolean))]
      .sort((a,b)=>a.localeCompare(b,"ja"));

    ownerSelect.innerHTML = '<option value="">変更しない</option>' + owners.map(v => '<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
    if(owners.includes(current)) ownerSelect.value = current;
  }

  const reasonSelect = $("bulkDeclineReason");
  if(reasonSelect){
    const current = reasonSelect.value;
    reasonSelect.innerHTML = '<option value="">変更しない</option>';

    const fallback = ["条件不一致","連絡不通","他社決定","本人都合","勤務条件","その他"];
    fallback.forEach(v => {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      reasonSelect.appendChild(opt);
    });

    if([...reasonSelect.options].some(o => o.value === current)) reasonSelect.value = current;
  }

  const all = $("bulkSelectAll");
  if(all && !all.dataset.bound){
    all.dataset.bound = "1";
    all.addEventListener("change", e => toggleBulkSelectAll(e.target.checked));
  }

  updateBulkSelectCount();
}

function buildBulkUpdatePayload(){
  const payload = {};
  const status = $("bulkStatus")?.value || "";
  const owner = $("bulkOwner")?.value || "";
  const decline = $("bulkDeclineReason")?.value || "";

  if(status) payload.status = status;
  if(owner) payload.owner_name = owner;
  if(decline) payload.decline_reason = decline;

  return payload;
}

async function bulkUpdateCandidates(){
  if(window.RecruitOpsGuard && !window.RecruitOpsGuard.requireWrite(currentRole)) return;
  const rows = getSelectedRows();
  if(!rows.length){
    if(window.RecruitUI) window.RecruitUI.toast("一括更新する応募者を選択してください。", "warning");
    return;
  }

  const payload = buildBulkUpdatePayload();
  if(!Object.keys(payload).length){
    if(window.RecruitUI) window.RecruitUI.toast("変更内容を選択してください。", "warning");
    return;
  }

  const ok = window.RecruitUI
    ? await window.RecruitUI.confirmAction("選択中の " + rows.length + "件を一括更新します。", {
        title:"一括更新確認",
        okText:"更新する",
        cancelText:"キャンセル",
        type:"warning"
      })
    : confirm("選択中の " + rows.length + "件を一括更新しますか？");

  if(!ok) return;

  try{
    const ids = rows.map(r => r.id);
    const { error } = await sb
      .from("candidates")
      .update(payload)
      .in("id", ids);

    if(error) throw error;

    if(window.RecruitAudit && window.RecruitAudit.write){
      await window.RecruitAudit.write("candidate_bulk_update", "candidates", "bulk", {
        count: rows.length,
        ids: ids.map(String),
        names: rows.map(r => r.name || ""),
        update: payload
      });
    }

    allCandidateRows = allCandidateRows.map(r => selectedIds.has(String(r.id)) ? {...r, ...payload} : r);

    selectedIds.clear();
    ["bulkStatus","bulkOwner","bulkDeclineReason"].forEach(id => {
      const el = $(id);
      if(el) el.value = "";
    });

    if(window.RecruitUI) window.RecruitUI.toast("一括更新しました", "success");
    renderCandidates();
  }catch(e){
    if(window.RecruitUI) window.RecruitUI.showError("一括更新に失敗しました。\n\n" + (e.message || e));
  }
}

async function bulkDeleteCandidates(){
  const rows = getSelectedRows();
  if(!rows.length){
    if(window.RecruitUI) window.RecruitUI.toast("一括削除する応募者を選択してください。", "warning");
    return;
  }

  if(!isAdminRole()){
    if(window.RecruitUI) window.RecruitUI.showError("削除できる権限がありません。");
    return;
  }

  const ok = window.RecruitUI
    ? await window.RecruitUI.confirmAction("選択中の " + rows.length + "件を一括削除します。\n\n※完全削除ではなく一覧から非表示にします。", {
        title:"一括削除確認",
        okText:"削除する",
        cancelText:"キャンセル",
        type:"warning"
      })
    : confirm("選択中の " + rows.length + "件を一括削除しますか？");

  if(!ok) return;

  try{
    const ids = rows.map(r => r.id);
    const { error } = await sb
      .from("candidates")
      .update({ is_deleted:true })
      .in("id", ids);

    if(error) throw error;

    if(window.RecruitAudit && window.RecruitAudit.write){
      await window.RecruitAudit.write("candidate_bulk_delete", "candidates", "bulk", {
        count: rows.length,
        ids: ids.map(String),
        names: rows.map(r => r.name || "")
      });
    }

    allCandidateRows = allCandidateRows.filter(r => !selectedIds.has(String(r.id)));
    selectedIds.clear();

    if(window.RecruitUI) window.RecruitUI.toast("一括削除しました", "success");
    renderCandidates();
  }catch(e){
    if(window.RecruitUI) window.RecruitUI.showError("一括削除に失敗しました。\n\n" + (e.message || e));
  }
}


function createCandidateRow(r, today){
  const tr=document.createElement("tr");
  tr.dataset.id=String(r.id);

  if(isActionRequired(r)){
    if(!r.next_action_date)tr.classList.add("action-missing");
    else if(r.next_action_date<today)tr.classList.add("action-over");
    else if(r.next_action_date===today)tr.classList.add("action-today");
    else tr.classList.add("action-soon");
  }

  tr.onclick=()=>{
    saveNav(r.id);
    location.href="./detail.html?id="+encodeURIComponent(r.id);
  };

  const dateClass=r.next_action_date<today?"date-over":r.next_action_date===today?"date-today":"";
  const checked = selectedIds.has(String(r.id)) ? " checked" : "";

  tr.innerHTML=
    '<td class="list-check-cell"><input type="checkbox" class="bulk-row-check" data-id="'+esc(r.id)+'" aria-label="選択"'+checked+'></td>'+
    "<td><strong>"+esc(r.name||"")+"</strong></td>"+
    "<td>"+formatDate(r.applied_date)+"</td>"+
    "<td>"+statusResultCell(r)+"</td>"+
    "<td>"+esc(r.division||"")+"</td>"+
    "<td>"+esc(r.center_name||"")+"</td>"+
    "<td>"+esc(r.channel||"")+"</td>"+
    "<td>"+esc(r.channel_detail||"")+"</td>"+
    "<td>"+esc(r.owner_name||"")+"</td>"+
    '<td><span class="'+dateClass+'">'+formatDate(r.next_action_date)+"</span></td>"+
    '<td class="list-action-cell"><button class="btn-danger list-delete-btn" type="button" data-requires-role="admin" data-id="'+esc(r.id)+'">削除</button></td>';

  const checkCell = tr.querySelector(".list-check-cell");
  const checkBox = tr.querySelector(".bulk-row-check");
  if(checkCell && checkBox){
    checkCell.addEventListener("click", e => {
      e.preventDefault();
      e.stopPropagation();
      if(e.target !== checkBox) checkBox.checked = !checkBox.checked;
      toggleBulkSelection(r.id, checkBox.checked);
    });
    checkBox.addEventListener("click", e => {
      e.stopPropagation();
    });
    checkBox.addEventListener("change", e => {
      e.stopPropagation();
      toggleBulkSelection(r.id, e.target.checked);
    });
  }

  const deleteBtn = tr.querySelector(".list-delete-btn");
  if(deleteBtn){
    deleteBtn.addEventListener("click", async (e)=>{
      e.preventDefault();
      e.stopPropagation();

      if(!isAdminRole()){
        if(window.RecruitUI) window.RecruitUI.showError("削除できる権限がありません。");
        return;
      }

      const ok = window.RecruitUI
        ? await window.RecruitUI.confirmAction(
            "この応募者を削除しますか？\n\n※完全削除ではなく一覧から非表示にします。",
            {
              title:"削除確認",
              okText:"削除する",
              cancelText:"キャンセル",
              type:"warning"
            }
          )
        : confirm("この応募者を削除しますか？");

      if(!ok) return;

      try{
        const { error } = await sb
          .from("candidates")
          .update({ is_deleted:true })
          .eq("id", r.id);

        if(error) throw error;

        if(window.RecruitAudit && window.RecruitAudit.candidateDelete){
          await window.RecruitAudit.candidateDelete(r.id, r);
        }else if(window.writeRecruitAuditLog){
          await window.writeRecruitAuditLog("candidate_delete", "candidates", r.id, {
            name:r.name || null,
            status:r.status || null
          });
        }

        allCandidateRows = allCandidateRows.filter(x => String(x.id) !== String(r.id));

        if(window.RecruitUI){
          window.RecruitUI.toast("削除しました", "success");
        }

        renderCandidates();

      }catch(err){
        if(window.RecruitUI){
          window.RecruitUI.showError("削除に失敗しました。\n\n" + (err.message || err));
        }else{
          if(window.RecruitUI){ window.RecruitUI.showError("削除に失敗しました。\n\n" + (err.message || err)); }
        }
      }
    });
  }

  return tr;
}

function createVirtualSpacerRow(height, className){
  const tr=document.createElement("tr");
  tr.className=className;
  const td=document.createElement("td");
  td.colSpan=11;
  td.style.height=Math.max(0,height)+"px";
  td.style.padding="0";
  td.style.border="none";
  tr.appendChild(td);
  return tr;
}

function renderVirtualCandidateRows(force=false){
  const tbody=document.querySelector("#candidateTable tbody");
  const wrap=document.querySelector(".table-card .table-wrap");
  const rows=listVirtualState.rows;
  if(!tbody || !wrap || !rows.length)return;

  const scrollTop=wrap.scrollTop || 0;
  const visibleHeight=wrap.clientHeight || 560;
  const rawStart=Math.floor(scrollTop / LIST_VIRTUAL_ROW_HEIGHT) - LIST_VIRTUAL_BUFFER;
  const rawEnd=Math.ceil((scrollTop + visibleHeight) / LIST_VIRTUAL_ROW_HEIGHT) + LIST_VIRTUAL_BUFFER;
  const startIndex=Math.max(0, rawStart);
  const endIndex=Math.min(rows.length, rawEnd);

  if(!force && startIndex===listVirtualState.start && endIndex===listVirtualState.end)return;

  listVirtualState.start=startIndex;
  listVirtualState.end=endIndex;

  const fragment=document.createDocumentFragment();
  const topHeight=startIndex * LIST_VIRTUAL_ROW_HEIGHT;
  const bottomHeight=Math.max(0, (rows.length - endIndex) * LIST_VIRTUAL_ROW_HEIGHT);

  fragment.appendChild(createVirtualSpacerRow(topHeight, "vscroll-spacer-top"));
  rows.slice(startIndex,endIndex).forEach(r=>{
    fragment.appendChild(createCandidateRow(r, listVirtualState.today));
  });
  fragment.appendChild(createVirtualSpacerRow(bottomHeight, "vscroll-spacer-bottom"));

  tbody.innerHTML="";
  tbody.appendChild(fragment);
  updateBulkSelectCount();
}

function setupListVirtualScroll(){
  const wrap=document.querySelector(".table-card .table-wrap");
  if(!wrap || wrap.dataset.virtualScrollReady==="1")return;
  wrap.dataset.virtualScrollReady="1";
  wrap.addEventListener("scroll",()=>renderVirtualCandidateRows(false),{passive:true});
}

function renderCandidates(){
  saveState();
  $("filterAllBtn").className=currentListFilter==="all"?"btn-primary":"btn-secondary";
  $("filterActionBtn").className=currentListFilter!=="all"?"btn-warning":"btn-secondary";
  updateSortButtons();
  renderStatusFilterChips();
  renderResultFilterChips();

  const rows=filteredRows();
  currentVisibleRows=rows;
  renderListActionGuide(rows);
  setupBulkOptions();
  saveListOrder(rows);

  const tbody=document.querySelector("#candidateTable tbody");
  const wrap=document.querySelector(".table-card .table-wrap");
  const today=todayStr();
  const actionInRows=rows.filter(isActionRequired).length;
  $("listCount").textContent="表示 "+rows.length+"件 / 条件 "+getListFilterLabel()+" / 要対応 "+actionInRows+"件";
  const overInRows=rows.filter(r=>r.next_action_date&&r.next_action_date<today).length;
  const todayInRows=rows.filter(r=>r.next_action_date===today).length;

  if($("sideKpiTotal"))$("sideKpiTotal").textContent=rows.length;
  if($("sideKpiAction"))$("sideKpiAction").textContent=actionInRows;
  if($("sideKpiOver"))$("sideKpiOver").textContent=overInRows;
  if($("sideKpiToday"))$("sideKpiToday").textContent=todayInRows;

  setupListVirtualScroll();
  listVirtualState.rows=rows;
  listVirtualState.today=today;
  listVirtualState.start=-1;
  listVirtualState.end=-1;

  if(!rows.length){
    tbody.innerHTML='<tr><td class="empty" colspan="11">表示対象のデータがありません</td></tr>';
    updateBulkSelectCount();
    return;
  }

  if(listShouldResetScroll && wrap){
    wrap.scrollTop=0;
  }
  listShouldResetScroll=false;

  renderVirtualCandidateRows(true);
  restoreNav();
}
function saveNav(id){
  const wrap=document.querySelector(".table-wrap");
  sessionStorage.setItem(NAV,JSON.stringify({
    restore:true,
    targetId:String(id),
    scrollY:window.scrollY,
    top:wrap?.scrollTop||0,
    left:wrap?.scrollLeft||0
  }));
}
function restoreNav(){
  const raw=sessionStorage.getItem(NAV);
  if(!raw)return;
  let state;
  try{state=JSON.parse(raw)}catch(e){return}
  if(!state?.restore)return;

  requestAnimationFrame(()=>{
    const wrap=document.querySelector(".table-wrap");
    if(wrap){
      wrap.scrollTop=state.top||0;
      wrap.scrollLeft=state.left||0;
    }
    window.scrollTo(0,state.scrollY||0);
    const tr=document.querySelector('tr[data-id="'+CSS.escape(state.targetId)+'"]');
    if(tr){
      tr.classList.add("return-highlight");
      tr.scrollIntoView({block:"center"});
      setTimeout(()=>tr.classList.remove("return-highlight"),3000);
    }
    sessionStorage.removeItem(NAV);
  });
}
async function loadCandidates(){
  try{
    const {data,error}=await sb
      .from("candidates")
      .select("id,name,applied_date,status,division,center_name,channel,channel_detail,owner_name,next_action_date,hiring_result,is_deleted,appointment_date,interview1_date,interview_done_date,offer_date,join_date,reject_reason,decline_reason,action_memo")
      .eq("is_deleted",false)
      .order("id",{ascending:false});
    if(error)throw error;

    allCandidateRows=data||[];
    await setupFilters(allCandidateRows);

    let latestCandidateMarker = null;
    try {
      latestCandidateMarker = JSON.parse(sessionStorage.getItem("recruit_list_show_latest_candidate") || "null");
    } catch(e) {
      latestCandidateMarker = null;
    }
    const shouldShowLatest = latestCandidateMarker && Date.now() - Number(latestCandidateMarker.at || 0) < 10 * 60 * 1000;

    const dashboardApplied=shouldShowLatest ? false : applyDashboardFilterIfExists();

    if(shouldShowLatest){
      currentListFilter = "all";
      sortMode = "appliedDesc";
      clearDashboardRangeFilter();
      dashboardContextActive = false;
      ["filterYear","filterMonth","filterDivision","filterCenter","filterOwner","filterChannel","filterDateFrom","filterDateTo"].forEach(id => {
        const el = $(id);
        if(el) el.value = "";
      });
      const latestDateType=$("filterDateType");
      if(latestDateType)latestDateType.value="applied_date";
      selectedStatusFilters.clear();
      selectedResultFilters.clear();
      localStorage.removeItem(STATE);
    }

    if(!dashboardApplied && !shouldShowLatest){
      const state=restoreState();
      if(state){
        currentListFilter=state.listFilter||"all";
        sortMode=state.sortMode || (state.sortAction===false ? "appliedDesc" : "actionAsc");
        clearDashboardRangeFilter();
        dashboardContextActive=false;
        const map={
          year:"filterYear",
          month:"filterMonth",
          division:"filterDivision",
          center:"filterCenter",
          owner:"filterOwner",
          channel:"filterChannel"
        };
        Object.entries(map).forEach(([key,id])=>{
          const el=$(id);
          if(el)el.value=state[key]||"";
        });
        setFilterValue("filterDateType",state.dateType||"applied_date");
        const dateFromEl=$("filterDateFrom");
        const dateToEl=$("filterDateTo");
        if(dateFromEl)dateFromEl.value=state.dateFrom||"";
        if(dateToEl)dateToEl.value=state.dateTo||"";
        selectedStatusFilters=new Set(Array.isArray(state.statuses)?state.statuses.map(v=>String(v||"").trim()).filter(Boolean):[]);
        selectedResultFilters=new Set(Array.isArray(state.results)?state.results.map(v=>String(v||"").trim()).filter(Boolean):[]);
      }
    }

    if(dashboardFilterActive)setDashboardYearDisplay();
    renderCandidates();

    if(shouldShowLatest && latestCandidateMarker?.id){
      requestAnimationFrame(() => {
        const tr = document.querySelector('tr[data-id="' + CSS.escape(String(latestCandidateMarker.id)) + '"]');
        if(tr){
          tr.classList.add("return-highlight");
          tr.scrollIntoView({block:"center"});
          setTimeout(() => tr.classList.remove("return-highlight"), 3000);
        }
        sessionStorage.removeItem("recruit_list_show_latest_candidate");
      });
    }
  }catch(e){
    RecruitUI.showError("一覧読込失敗: "+(e.message||e));
    console.error(e);
  }
}
async function initPageAfterLogin(){
  await loadCandidates();
}
["filterYear","filterMonth","filterDivision","filterCenter","filterOwner","filterChannel","filterDateType","filterDateFrom","filterDateTo"].forEach(id=>{
  document.addEventListener("change",e=>{
    if(e.target&&e.target.id===id){
      if(dashboardContextActive){
        clearDashboardRangeFilter();
        dashboardContextActive=false;
      }
      saveState();
      requestRenderCandidates();
    }
  });
});
authInit();
