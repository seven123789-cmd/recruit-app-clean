<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>社員一覧 — 資格・免許管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/common.css">
<link rel="stylesheet" href="assets/css/visual-upgrade.css">
<link rel="stylesheet" href="assets/css/employees-fix.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar" id="sidebar"></aside>
<div class="page-content">
<main class="page-main">
  <div class="page-header">
    <div class="page-heading">
      <div class="page-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div><div class="page-title">社員一覧</div><div class="page-title-en">Employee Directory</div></div>
    </div>
  </div>
  <div class="filter-panel">
    <div class="filter-grid compact">
      <div class="form-group"><label class="form-label">氏名・コード検索</label><input type="text" id="filter-keyword" class="form-control" placeholder="氏名・社員コード・センター"></div>
      <div class="form-group"><label class="form-label">センター</label><select id="filter-center" class="form-control"></select></div>
      <div class="form-group"><label class="form-label">職種</label><select id="filter-position" class="form-control"></select></div>
      <div class="form-group"><label class="form-label">雇用形態</label><select id="filter-employment" class="form-control"><option value="">すべて</option></select></div>
      <div class="form-group"><label class="form-label">昇格候補</label><select id="filter-promo" class="form-control"><option value="">すべて</option><option value="yes">候補のみ</option></select></div>
      <button id="btn-clear-filter" class="btn btn-secondary" style="margin-top:auto">リセット</button>
    </div>
  </div>
  <div class="table-card">
    <div class="table-tools">
      <div class="table-count">計 <strong id="emp-count">—</strong> 名</div>
      <span class="text-muted text-sm">行クリックで詳細へ</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>社員コード</th><th>氏名</th><th>センター</th><th>職種</th><th>雇用形態</th><th>等級</th><th>昇格候補</th><th style="width:80px"></th></tr></thead>
        <tbody id="emp-tbody"></tbody>
      </table>
    </div>
    <div class="pagination" id="emp-pagination"></div>
  </div>
</main>
</div>
</div>
<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/employees.js"></script>
<script>(async()=>{await Auth.requireAuth();renderSidebar('employees');Modal.setup();APP.initHeader();await initEmployees();})();</script>
</body></html>
